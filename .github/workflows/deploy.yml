name: Deploy viewer

# Builds the viewer and copies it to the S3 bucket behind
# road-network-connectivity.nemac.org.
#
# The PMTiles are not part of this. They are gitignored, so the build here has
# no data/ folder, and they reach the bucket from a workstation through
# `npm run tiles:publish`. Every step below leaves data/ in the bucket alone,
# and the deploy role is denied writes there as a second guard.
#
# Three repository variables (Settings > Secrets and variables > Actions >
# Variables) come from the outputs of the CloudFormation stack in infra/:
#   AWS_DEPLOY_ROLE_ARN          DeployRoleArn
#   S3_BUCKET                    BucketName
#   CLOUDFRONT_DISTRIBUTION_ID   DistributionId

on:
  push:
    branches: [master]

permissions:
  id-token: write   # lets the job sign in to AWS without stored keys
  contents: read

# One deploy at a time, and never abandon one half way through an upload.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # Vite puts a content hash in every filename under assets/, so those can
      # be cached for a year.
      - name: Upload hashed assets
        run: >
          aws s3 sync dist/assets "s3://${{ vars.S3_BUCKET }}/assets"
          --delete
          --cache-control "public, max-age=31536000, immutable"

      # Everything else keeps its name between deploys, so browsers are told
      # to check for a newer copy each time.
      - name: Upload the rest
        run: >
          aws s3 sync dist "s3://${{ vars.S3_BUCKET }}"
          --delete
          --exclude "assets/*"
          --exclude "data/*"
          --cache-control "no-cache"

      - name: Refresh CloudFront
        run: >
          aws cloudfront create-invalidation
          --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}"
          --paths "/" "/index.html" "/assets/*" "/docs/*" "/brand/*" "/fonts/*"
